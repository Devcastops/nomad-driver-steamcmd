name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "The following files are not gofmt'd:"
            echo "$diff"
            exit 1
          fi

      - name: Unit tests
        run: go test ./... -race -v -coverprofile=coverage.out

      - name: Build plugin binary
        run: go build -o dist/nomad-driver-steamcmd ./cmd/nomad-driver-steamcmd

      - name: Upload plugin binary
        uses: actions/upload-artifact@v4
        with:
          name: nomad-driver-steamcmd
          path: dist/nomad-driver-steamcmd
          retention-days: 7

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

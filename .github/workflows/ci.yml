name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Resolve modules
        # `go mod tidy` occasionally hits a transient network error talking
        # to sum.golang.org (Go's checksum database) -- an HTTP/2 stream
        # error unrelated to anything in this repo. A short retry clears
        # it without needing a manual workflow re-run every time it happens.
        run: |
          for i in 1 2 3; do
            if go mod tidy; then
              exit 0
            fi
            echo "go mod tidy failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done
          echo "::error::go mod tidy failed after 3 attempts"
          exit 1

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "The following files are not gofmt'd:"
            echo "$diff"
            exit 1
          fi

      - name: Unit tests
        run: go test ./... -race -v -coverprofile=coverage.out

      - name: Build plugin binary
        run: go build -o dist/nomad-driver-steamcmd ./cmd/nomad-driver-steamcmd

      - name: Upload plugin binary
        uses: actions/upload-artifact@v4
        with:
          name: nomad-driver-steamcmd
          path: dist/nomad-driver-steamcmd
          retention-days: 7

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

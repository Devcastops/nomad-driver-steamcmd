name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Resolve modules
        run: go mod tidy

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          go build \
            -ldflags "-X github.com/byteford/nomad-driver-steamcmd/driver.pluginVersion=${version}" \
            -o dist/nomad-driver-steamcmd \
            ./cmd/nomad-driver-steamcmd

      - name: Package
        run: |
          cd dist
          pkg="nomad-driver-steamcmd_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir "$pkg"
          mv nomad-driver-steamcmd "$pkg/"
          tar -czf "${pkg}.tar.gz" "$pkg"
          sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomad-driver-steamcmd_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
